### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hyprland.org/Configuring/Environment-variables/

env = XCURSOR_SIZE,24
env = HYPRCURSOR_THEME,MOYASH-Pixel-Black-vr10 # Replace Bibata-Modern-Ice with the name of the theme you downloaded
env = XCURSOR_THEME,MOYASH-Pixel-Black-vr10
